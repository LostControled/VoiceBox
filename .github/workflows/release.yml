name: Release VoiceBox

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.0.0'
        required: true
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source
        run: |
          unzip -o VoiceBox-source.zip -d appsrc
          cd appsrc/VoiceBox-source
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd appsrc/VoiceBox-source
          xcodebuild \
            -project VoiceBox.xcodeproj \
            -scheme VoiceBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p Payload
          cp -R appsrc/VoiceBox-source/build/Build/Products/Release-iphoneos/VoiceBox.app Payload/
          zip -qry "VoiceBox-${VERSION}.ipa" Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: VoiceBox ${{ inputs.version }}
          generate_release_notes: true
          files: VoiceBox-${{ inputs.version }}.ipa
          fail_on_unmatched_files: true
