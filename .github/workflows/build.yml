
name: Build VoiceBox IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source
        run: |
          unzip -o VoiceBox-source.zip -d appsrc
          cd appsrc/VoiceBox-source
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd appsrc/VoiceBox-source
          xcodebuild \
            -project VoiceBox.xcodeproj \
            -scheme VoiceBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R appsrc/VoiceBox-source/build/Build/Products/Release-iphoneos/VoiceBox.app Payload/
          zip -qry VoiceBox-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBox-unsigned-IPA
          path: VoiceBox-unsigned.ipa
          if-no-files-found: error
